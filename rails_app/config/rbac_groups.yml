---
# Host-owned RBAC. CommandTower ships CT entity definitions in
# lib/command_tower/authorization/default.yml. Hosts grant those names to
# product roles and may add host-owned entities for host controllers.
# Operational Admin privilege bundles are host-owned (least privilege).
groups:
  member:
    description: Standard authenticated application user
    entities:
      - email_verification_send
      - email_verification_verify
      - session
      - me
      - profile
      - me_name
      - me_password
      - me_inbox
      - me_audit_events
      - me_preferences
      - me_phone
      - me_phone_verification_send
      - me_phone_verification_verify
      - me_pushover
      - me_pushover_verification
      - principal_capabilities
  audit_operator:
    description: Dummy host role with Admin Workspace and audit only
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_audit_events
  messaging_operator:
    description: Dummy host role with Admin Workspace and messaging only
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_messaging_announcements
  operations_admin:
    description: Dummy host role with all CT Admin Workspace capabilities
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_audit_events
      - admin_messaging_announcements
      - admin_users
  impersonation_operator:
    description: Dummy host role that can start impersonation of visible users
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_users
      - admin_impersonation
  admin:
    description: |
      Host-owned deliberate broad Admin bundle (host policy, not platform default).
      Grants CT Admin Workspace, audit, messaging, users, and identity-update entities.
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_audit_events
      - admin_messaging_announcements
      - admin_users
      - admin_users_update
      - admin_rbac_assignments
  users_identity_admin:
    description: Identity mutations on Users without RBAC assignment
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_users
      - admin_users_update
  rbac_admin:
    description: Assign and revoke allowed Admin Users roles
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_users
      - admin_rbac_assignments
  audit_admin:
    description: Audit Explorer plus Users inspection
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_users
      - admin_audit_events
  support_admin:
    description: Users inspection subset used to prove grant-subset assignment
    entities:
      - principal_capabilities
      - admin_workspace
      - admin_users
entities:
  - name: dummy_admin_example
    controller: FoundationProof::WorkspaceExampleController
    only: show
