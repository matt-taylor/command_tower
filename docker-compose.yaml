volumes:
  bundle:
    driver: local
  mysql:
    driver: local

x-common-environment: &common-environment
  RAILS_ENV: "development"
  MYSQL_HOST: "mysql"
  MYSQL_USER: "root"
  MYSQL_PORT: "3306"
  MYSQL_PASSWORD: "root"
  BUNDLE_PATH: "/bundle"
  BUNDLE_JOBS: "2"
  BUNDLE_RETRY: "3"
  command_tower_URL: "http://localhost"
  command_tower_PORT: "7777"
  SESSION_TIMEOUT_IN_SECONDS: "900"
  SESSION_TIMEOUT_WARNING: "true"
  RAILS_MAX_THREADS: "1"
  REDIS_URL: "redis://redis"
  BUNDLER_RAILS_VERSION: "~> 8"

services:
  mysql:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_HOST=mysql
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    expose:
      - "3310"
    volumes:
      - mysql:/var/lib/mysql
    # Over TCP so the first-boot init server (socket only) does not count as ready; lets
    # `docker compose up --wait mysql` (orchestrated lanes) return only once connections work.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
  redis:
    image: redis
    expose:
      - 6379
  engine:
    build:
      args:
        BUNDLE_WITHOUT: "darwin"
        RAILS_ENV: development
      target: base
      context: .
    command: bin/rails s -p 7777 -e development -b '0.0.0.0'
    # so things like pry work
    tty: true
    stdin_open: true
    volumes:
      - .:/engine
      - bundle:/bundle
      - ..:/local
    env_file:
      - .env
    environment:
      <<: *common-environment
    ports:
      - "${APP_PORT:-7777}:7777"
    links:
      - mysql
      - redis
